<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04080d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>JARVIS</title>
<style>
  :root {
    --cyan: #5bd8ff;
    --cyan-dim: #1d6f8f;
    --amber: #ffb648;
    --bg: #04080d;
    --ink: #cfeeff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #0a1826 0%, var(--bg) 60%, #010306 100%);
    color: var(--ink);
    font: 400 15px/1.45 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    letter-spacing: .04em;
    display: flex; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  body::before { /* scanlines */
    content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .35;
    background: repeating-linear-gradient(to bottom, rgba(91,216,255,.05) 0 1px, transparent 1px 3px);
  }
  header { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--cyan-dim); text-transform: uppercase; }
  header b { color: var(--cyan); letter-spacing: .5em; font-weight: 500; }

  .stage { flex: 0 0 auto; display: grid; place-items: center; padding: 18px 0 6px; }
  .orb-wrap { position: relative; width: min(58vw, 230px); aspect-ratio: 1; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(91,216,255,.22); }
  .ring.r2 { inset: 10%; border-style: dashed; animation: spin 18s linear infinite; }
  .ring.r3 { inset: 20%; border-color: rgba(91,216,255,.35); animation: spin 26s linear reverse infinite; border-top-color: var(--cyan); }
  .ring.r4 { inset: 32%; border-color: rgba(255,182,72,.25); animation: spin 9s linear infinite; border-left-color: var(--amber); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .core {
    position: relative; width: 44%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #eafcff 0%, var(--cyan) 38%, #0d5f85 70%, #06202f 100%);
    box-shadow: 0 0 30px rgba(91,216,255,.45), 0 0 90px rgba(91,216,255,.22), inset 0 0 20px rgba(255,255,255,.35);
    transform: scale(calc(0.92 + var(--mic, 0) * 0.22));
    transition: transform .09s ease-out, box-shadow .2s;
  }
  body.speaking .core {
    background: radial-gradient(circle at 50% 45%, #fff6e6 0%, var(--amber) 38%, #a2660f 72%, #2a1703 100%);
    box-shadow: 0 0 40px rgba(255,182,72,.55), 0 0 110px rgba(255,182,72,.25), inset 0 0 20px rgba(255,255,255,.4);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.07); } }

  .status { text-align: center; font-size: 12px; text-transform: uppercase; color: var(--cyan-dim); min-height: 18px; margin-top: 6px; }
  .status.ok { color: var(--cyan); }
  .status.bad { color: #ff6b6b; }
  .diag { text-align: center; font-size: 10px; color: rgba(91,216,255,.45); min-height: 14px; letter-spacing: .08em; }

  #log { flex: 1; overflow-y: auto; margin: 14px 0; padding: 12px; border: 1px solid rgba(91,216,255,.18); border-radius: 12px; background: rgba(6,20,32,.5); backdrop-filter: blur(6px); }
  .line { margin-bottom: 10px; display: flex; gap: 8px; align-items: flex-start; }
  .line .who { font-size: 10px; padding: 2px 6px; border-radius: 4px; flex: 0 0 auto; }
  .line.you .who { color: var(--cyan); border: 1px solid rgba(91,216,255,.4); }
  .line.jarvis .who { color: var(--amber); border: 1px solid rgba(255,182,72,.4); }
  .line .txt { flex: 1; }
  .line.you .txt { color: #9fd8f2; }
  #log:empty::before { content: 'transcript standby…'; color: var(--cyan-dim); font-size: 12px; }

  .controls { display: flex; gap: 10px; align-items: center; }
  button, select {
    font: inherit; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cyan); background: rgba(12,38,55,.7); border: 1px solid rgba(91,216,255,.4);
    border-radius: 10px; padding: 13px 16px; flex: 1; min-height: 48px;
  }
  select { flex: 1.1; -webkit-appearance: none; appearance: none; text-align: center; }
  button:active { background: rgba(91,216,255,.2); }
  button.on { color: var(--amber); border-color: rgba(255,182,72,.6); }
  button#hangup { color: #ff8585; border-color: rgba(255,90,90,.45); }
  button:disabled { opacity: .5; }
  .hidden { display: none !important; }

  #boot { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; }
  #boot p { color: var(--cyan-dim); font-size: 12px; margin: 0; }
  #engage { font-size: 15px; padding: 18px; letter-spacing: .3em; }
</style>
</head>
<body>
  <header><b>J.A.R.V.I.S</b><span id="clock"></span></header>

  <div class="stage">
    <div class="orb-wrap" id="ring">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
      <div class="core" id="orb"></div>
    </div>
  </div>
  <div class="status" id="status">offline</div>
  <div class="diag" id="diag"></div>

  <div id="boot">
    <p>Voice link to Qwen realtime · relay secured on host</p>
    <button id="engage">Engage</button>
  </div>

  <div id="hud" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div id="log"></div>
    <div class="controls">
      <select id="voice">
        <option value="daniel">Daniel</option>
        <option value="loongjohn">John</option>
        <option value="echo">Echo</option>
        <option value="hannah">Hannah</option>
        <option value="sherry">Sherry</option>
        <option value="loongmary">Mary</option>
        <option value="longanqian">Anqian</option>
      </select>
      <button id="ptt">Hold&nbsp;to&nbsp;talk</button>
      <button id="mute">Mute</button>
      <button id="hangup">End</button>
    </div>
  </div>

<script>
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
  }, 1000);
</script>
<script src="app.js"></script>
</body>
</html>
